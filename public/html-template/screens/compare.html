<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="page">
      <div class="phone">
        <div class="content onboard-content">
          <div class="noise"></div>
          <div class="onboard-top">
            <span class="onboard-close">x</span>
            RideSync+
          </div>

          <div class="hero-wrap">
            <div class="hero-shadow"></div>
            <div class="hero-tilt">
              <div class="hero-card">
                <div class="hero-map">
                  <img src="../mapphoto.png" alt="" />
                  <div class="tint"></div>
                </div>
                <div class="hero-pin-ring"></div>
                <div class="hero-pin-core"></div>
                <div class="hero-pin-glow"></div>
                <div class="hero-price">
                  <div style="display:flex; align-items:center; gap:6px;">
                    <div class="car">🚗</div>
                    <div class="bar"></div>
                  </div>
                  <span>GHS 12.50</span>
                </div>
              </div>
            </div>
          </div>

          <h2 style="margin-top:24px;">Compare & Save</h2>
          <p class="subtitle">Find the best prices across Uber, Bolt, and Yango in seconds.</p>

          <div class="dot-row">
            <span class="dot"></span>
            <span class="dot active"></span>
            <span class="dot"></span>
          </div>

          <a class="btn" href="favorites.html">Next →</a>
          <div style="text-align:center; margin-top:12px; font-size:10px; color:rgba(255,255,255,0.4);">Skip intro</div>
        </div>
      </div>
    </div>
  </body>
</html>
