<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="page">
      <div class="phone">
        <div class="status">
          <a class="back-btn" href="profile.html"><span>←</span>Back</a>
          <span class="status-title">Edit Profile</span>
          <div class="status-dots"><span></span><span></span><span></span></div>
        </div>
        <div class="content">
          <div style="display:flex; justify-content:center; margin-top:8px;">
            <div style="width:80px; height:80px; border-radius:50%; background:rgba(255,255,255,0.1); position:relative;">
              <span style="position:absolute; bottom:6px; right:6px; width:20px; height:20px; border-radius:50%; background:var(--fuchsia-500);"></span>
            </div>
          </div>
          <div class="space-y-3" style="margin-top:16px;">
            <input class="input" value="Alexa Johnson" />
            <input class="input" value="alexa@email.com" />
            <input class="input" value="+233 24 000 000" />
            <input class="input" value="Ghana" />
          </div>
          <div style="margin-top:20px;">
            <a class="btn" href="profile.html">Save Changes</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
