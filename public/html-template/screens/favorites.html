<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favorites</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="page">
      <div class="phone">
        <div class="content onboard-content">
          <div class="noise"></div>
          <div class="onboard-top">
            <span class="onboard-close">x</span>
            RideSync+
          </div>

          <div class="hero-wrap">
            <div class="hero-shadow" style="transform: translate(4px, 6px) rotate(5deg) scale(0.98);"></div>
            <div class="hero-tilt">
              <div class="hero-card">
                <div class="hero-icons">
                  <div class="hero-icon" style="position:absolute; left:50%; top:32px; transform:translateX(-50%);">
                    <div class="bubble">
                      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 21s6-5.3 6-10a6 6 0 1 0-12 0c0 4.7 6 10 6 10Z" stroke="currentColor" stroke-width="1.4" />
                        <circle cx="12" cy="11" r="2.4" fill="currentColor" />
                      </svg>
                    </div>
                  </div>

                  <div class="hero-icon" style="position:absolute; left:24px; top:120px;">
                    <div class="bubble">
                      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 11.5 12 5l8 6.5v7a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 5 18.5v-7Z" stroke="currentColor" stroke-width="1.4" />
                        <path d="M9.5 20v-6h5v6" stroke="currentColor" stroke-width="1.4" />
                      </svg>
                    </div>
                    <span>Home</span>
                    <span class="sub">Set address</span>
                  </div>

                  <div class="hero-icon" style="position:absolute; left:50%; top:126px; transform:translateX(-50%);">
                    <div class="bubble">
                      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="7.5" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.4" />
                        <path d="M9 7.5V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v1.5" stroke="currentColor" stroke-width="1.4" />
                      </svg>
                    </div>
                    <span>Work</span>
                    <span class="sub">Set address</span>
                  </div>

                  <div class="hero-icon" style="position:absolute; right:24px; top:120px;">
                    <div class="bubble">
                      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 9.5 12 6l8 3.5-8 3.5-8-3.5Z" stroke="currentColor" stroke-width="1.4" />
                        <path d="M8.5 12.8V16c0 1.2 7 1.2 7 0v-3.2" stroke="currentColor" stroke-width="1.4" />
                      </svg>
                    </div>
                    <span>School</span>
                    <span class="sub">Set address</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <h2 style="margin-top:24px;">Save Your Favorite Places</h2>
          <p class="subtitle">Find the best prices across Uber, Bolt, and Yango in seconds.</p>

          <div class="dot-row">
            <span class="dot"></span>
            <span class="dot active"></span>
            <span class="dot"></span>
          </div>

          <a class="btn" href="insights.html">Next →</a>
          <div style="text-align:center; margin-top:12px; font-size:10px; color:rgba(255,255,255,0.4);">Skip intro</div>
        </div>
      </div>
    </div>
  </body>
</html>
