<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="page">
      <div class="phone">
        <div class="status">
          <a class="back-btn" href="login.html"><span>←</span>Back</a>
          <span class="status-title">Create Account</span>
          <div class="status-dots"><span></span><span></span><span></span></div>
        </div>
        <div class="content">
          <h2>Create Account</h2>
          <p class="subtitle">Get instant access to live ride rates.</p>
          <div class="space-y-3" style="margin-top:20px;">
            <input class="input" placeholder="Full name" />
            <input class="input" placeholder="Email" />
            <input class="input" placeholder="Phone" />
            <input class="input" type="password" placeholder="Password" />
          </div>
          <div style="margin-top:20px;">
            <a class="btn" href="home.html">Create Account</a>
          </div>
          <div style="margin-top:18px; display:flex; align-items:center; gap:12px; font-size:12px; color:rgba(255,255,255,0.5);">
            <span style="height:1px; flex:1; background:rgba(255,255,255,0.1);"></span>
            sign up with
            <span style="height:1px; flex:1; background:rgba(255,255,255,0.1);"></span>
          </div>
          <div class="row" style="margin-top:14px;">
            <button class="input" style="text-align:center;">Google</button>
            <button class="input" style="text-align:center;">Apple</button>
          </div>
          <div style="margin-top:24px; text-align:center; font-size:12px; color:rgba(255,255,255,0.5);">
            Already have an account? <a class="text-pink" href="login.html">Login</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
