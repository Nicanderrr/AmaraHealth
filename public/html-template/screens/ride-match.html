<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ride Match</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="page">
      <div class="phone">
        <div class="status">
          <a class="back-btn" href="home.html"><span>←</span>Back</a>
          <span class="status-title">RideSync+</span>
          <div class="status-dots"><span></span><span></span><span></span></div>
        </div>
        <div class="content">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Ride Matching</h2>
            <button class="pill">Sort</button>
          </div>
          <a class="card" href="ride-details.html" style="margin-top:14px; display:block;">
            <div class="text-muted" style="font-size:12px;">Best match</div>
            <div style="margin-top:12px; display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-weight:600;">Bolt</div>
                <div class="text-muted" style="font-size:12px;">2 min away</div>
              </div>
              <div class="text-pink" style="font-size:18px; font-weight:600;">₵24.50</div>
            </div>
            <div style="margin-top:10px; display:flex; gap:8px;">
              <span class="pill active" style="font-size:10px; padding:4px 10px;">Fastest</span>
              <span class="pill" style="font-size:10px; padding:4px 10px;">Comfort</span>
            </div>
          </a>
          <div class="space-y-3" style="margin-top:12px;">
            <a class="list-item" href="ride-details.html"><span>UberX (5 min)</span><span class="text-pink">₵26.90</span></a>
            <a class="list-item" href="ride-details.html"><span>Yango Comfort (4 min)</span><span class="text-pink">₵27.80</span></a>
            <a class="list-item" href="ride-details.html"><span>Bolt Economy (6 min)</span><span class="text-pink">₵23.10</span></a>
          </div>
          <div class="card" style="margin-top:16px;">
            <div class="text-muted" style="font-size:12px;">Estimated arrival</div>
            <div style="margin-top:8px; font-weight:600;">10:32 AM • Destination: East Legon</div>
          </div>
        </div>
        <div class="footer">
          <div class="nav">
            <a class="nav-item" href="home.html"><span class="icon">🏠</span>HOME</a>
            <a class="nav-item" href="history.html"><span class="icon">⏱</span>HISTORY</a>
            <a class="nav-center" href="explore.html"><span>🗺</span></a>
            <a class="nav-item" href="insights-main.html"><span class="icon">📈</span>INSIGHTS</a>
            <a class="nav-item" href="profile.html"><span class="icon">👤</span>PROFILE</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
