<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ride Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="page">
      <div class="phone">
        <div class="status">
          <a class="back-btn" href="ride-match.html"><span>←</span>Back</a>
          <span class="status-title">Ride Details</span>
          <div class="status-dots"><span></span><span></span><span></span></div>
        </div>
        <div class="content">
          <div class="card">
            <div class="text-muted" style="font-size:12px;">Live map</div>
            <div class="map" style="height:120px; margin-top:10px;">
              <svg viewBox="0 0 320 200" aria-hidden="true">
                <rect width="320" height="200" fill="#f7eef4" />
                <path d="M18 34h110l45 35h70l50-20" stroke="#d4c1cf" stroke-width="6" fill="none" />
                <path d="M10 120h140l30-20h95l30 25" stroke="#e2cfd9" stroke-width="5" fill="none" />
                <circle cx="96" cy="120" r="10" fill="#ff4f9a" />
              </svg>
              <div class="badge">High Demand Zone</div>
            </div>
          </div>
          <div class="card" style="margin-top:16px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-weight:600;">UberX</div>
                <div class="text-muted" style="font-size:12px;">4 min away</div>
              </div>
              <div class="text-pink" style="font-size:18px; font-weight:600;">₵24.50</div>
            </div>
            <div style="margin-top:10px; font-size:12px; color:rgba(255,255,255,0.6); display:flex; justify-content:space-between;">
              <span>Pickup</span><span>East Legon</span>
            </div>
            <div style="margin-top:6px; font-size:12px; color:rgba(255,255,255,0.6); display:flex; justify-content:space-between;">
              <span>Drop-off</span><span>Airport</span>
            </div>
          </div>
          <div class="card" style="margin-top:16px;">
            <div class="text-muted" style="font-size:12px;">Driver info</div>
            <div style="margin-top:12px; display:flex; gap:10px; align-items:center;">
              <div style="width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.1);"></div>
              <div>
                <div style="font-weight:600;">Kevin Mensah</div>
                <div class="text-muted" style="font-size:12px;">⭐ 4.9 (1,240)</div>
              </div>
            </div>
          </div>
          <div style="margin-top:20px;">
            <a class="btn" href="home.html">Continue to App</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
