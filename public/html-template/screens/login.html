<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="page">
      <div class="phone">
        <div class="status">
          <a class="back-btn" href="insights.html"><span>←</span>Back</a>
          <span class="status-title">Welcome Back</span>
          <div class="status-dots"><span></span><span></span><span></span></div>
        </div>
        <div class="content">
          <h2>Welcome Back</h2>
          <p class="subtitle">Compare prices. Save on rides.</p>
          <div class="space-y-3" style="margin-top:20px;">
            <input class="input" placeholder="Email" />
            <input class="input" type="password" placeholder="Password" />
            <div style="text-align:right; font-size:12px; color:var(--fuchsia-400);">Forgot Password?</div>
          </div>
          <div style="margin-top:20px;">
            <a class="btn" href="home.html">Login</a>
          </div>
          <div style="margin-top:18px; display:flex; align-items:center; gap:12px; font-size:12px; color:rgba(255,255,255,0.5);">
            <span style="height:1px; flex:1; background:rgba(255,255,255,0.1);"></span>
            or continue with
            <span style="height:1px; flex:1; background:rgba(255,255,255,0.1);"></span>
          </div>
          <div class="row" style="margin-top:14px;">
            <button class="input" style="text-align:center;">Google</button>
            <button class="input" style="text-align:center;">Apple</button>
          </div>
          <div style="margin-top:24px; text-align:center; font-size:12px; color:rgba(255,255,255,0.5);">
            Don’t have an account? <a class="text-pink" href="signup.html">Sign up</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
