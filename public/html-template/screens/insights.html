<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insights Onboarding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="page">
      <div class="phone">
        <div class="content onboard-content">
          <div class="noise"></div>
          <div class="onboard-top">
            <span class="onboard-close">x</span>
            RideSync+
          </div>

          <div class="hero-wrap">
            <div class="hero-shadow"></div>
            <div class="hero-tilt">
              <div class="hero-card">
                <div class="hero-insights">
                  <div class="trend">
                    <div>
                      <div class="label">Price Trend</div>
                      <div class="value">-12%</div>
                      <div class="drop">dropping</div>
                    </div>
                    <div class="mini">
                      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 16l6-6 4 4 6-7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                        <circle cx="10" cy="10" r="1" fill="currentColor" />
                      </svg>
                    </div>
                  </div>
                </div>

                <div class="hero-reco">
                  <div class="spark">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M12 4l1.3 3.2 3.5 1.2-3.1 1.2-1.7 3-1.7-3-3.1-1.2 3.5-1.2L12 4Z" fill="currentColor" />
                      <path d="M6 14l.7 1.7 1.8.6-1.6.6-.9 1.5-.9-1.5-1.6-.6 1.8-.6L6 14Z" fill="currentColor" />
                      <path d="M18 13.5l.6 1.4 1.5.5-1.3.5-.8 1.3-.8-1.3-1.3-.5 1.5-.5.6-1.4Z" fill="currentColor" />
                    </svg>
                  </div>
                  <div class="title">Smart Recommendation</div>
                  <div class="desc">UberX is cheaper than Bolt at 3:00pm</div>
                </div>

                <div class="hero-pin-mini">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 21s6-5.3 6-10a6 6 0 1 0-12 0c0 4.7 6 10 6 10Z" stroke="currentColor" stroke-width="1.4" />
                    <circle cx="12" cy="11" r="2.4" fill="currentColor" />
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <h2 style="margin-top:64px;">Make Smarter Travel Decisions</h2>
          <p class="subtitle">Find the best prices across Uber, Bolt, and Yango in seconds.</p>

          <div class="dot-row">
            <span class="dot"></span>
            <span class="dot active"></span>
            <span class="dot"></span>
          </div>

          <a class="btn" href="login.html">Get Started</a>
        </div>
      </div>
    </div>
  </body>
</html>
